<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dolar Berjatuhan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #001f0d, #075b2b, #001a09);
        }

        /* Dolar */
        .dollar {
            position: fixed;
            top: -80px;
            color: #00ff66;
            font-size: 45px;
            font-weight: bold;
            text-shadow:
                0 0 5px #00ff66,
                0 0 15px #00ff66,
                0 0 25px #00ff66;

            animation-name: jatuh;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes jatuh {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform: translateY(50vh) rotate(180deg);
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Posisi dan kecepatan dolar */
        .dollar:nth-child(1) {
            left: 3%;
            animation-duration: 5s;
        }

        .dollar:nth-child(2) {
            left: 10%;
            animation-duration: 7s;
            animation-delay: 2s;
            font-size: 30px;
        }

        .dollar:nth-child(3) {
            left: 18%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .dollar:nth-child(4) {
            left: 27%;
            animation-duration: 8s;
            animation-delay: 3s;
            font-size: 55px;
        }

        .dollar:nth-child(5) {
            left: 35%;
            animation-duration: 5s;
            animation-delay: 1s;
        }

        .dollar:nth-child(6) {
            left: 44%;
            animation-duration: 7s;
            animation-delay: 4s;
            font-size: 35px;
        }

        .dollar:nth-child(7) {
            left: 53%;
            animation-duration: 6s;
            animation-delay: 2s;
        }

        .dollar:nth-child(8) {
            left: 62%;
            animation-duration: 8s;
            animation-delay: 1s;
            font-size: 55px;
        }

        .dollar:nth-child(9) {
            left: 71%;
            animation-duration: 5s;
            animation-delay: 3s;
        }

        .dollar:nth-child(10) {
            left: 80%;
            animation-duration: 7s;
            animation-delay: 1s;
            font-size: 35px;
        }

        .dollar:nth-child(11) {
            left: 88%;
            animation-duration: 6s;
            animation-delay: 4s;
        }

        .dollar:nth-child(12) {
            left: 96%;
            animation-duration: 9s;
            animation-delay: 2s;
            font-size: 55px;
        }

        /* Konten */
        .content {
            position: relative;
            z-index: 10;
            color: white;
            text-align: center;
            padding-top: 200px;
        }

        h1 {
            font-size: 50px;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
        }

        p {
            margin-top: 15px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- Dolar jatuh -->
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>
    <div class="dollar">$</div>

    <div class="content">
        <h1>BINTANG ADI HERIYANTO</h1>
        <p>BIODATA DIRI</p>
    </div>

</body>
</html>
